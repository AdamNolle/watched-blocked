<!doctype html>
<html><head><meta charset="utf-8"><title>Fixture</title>
<style>ytd-rich-item-renderer,ytd-video-renderer,yt-lockup-view-model,ytd-compact-video-renderer,ytd-playlist-panel-video-renderer,ytd-grid-video-renderer{display:block;min-height:20px;margin:4px;border:1px solid #ccc}</style>
</head><body><ytd-app><div id="content"><ytd-page-manager id="page-manager">
<ytd-watch-flexy><div id="player"><div id="movie_player" class="html5-video-player"><div class="ytp-progress-bar"><div class="ytp-play-progress" style="width: 50%"></div></div>
<yt-lockup-view-model class="lockup" id="player-endscreen"><div class="yt-lockup-view-model"><a class="yt-lockup-view-model__content-image" href="/watch?v=player-endscreen"><yt-thumbnail-view-model class="ytThumbnailViewModelHost"><div class="ytThumbnailViewModelImage"><img alt=""></div><yt-thumbnail-overlay-progress-bar-view-model class="ytThumbnailOverlayProgressBarHost"><div class="ytThumbnailOverlayProgressBarHostWatchedProgressBar"><div class="ytThumbnailOverlayProgressBarHostWatchedProgressBarSegment" style="width: 100%;"></div></div></yt-thumbnail-overlay-progress-bar-view-model></yt-thumbnail-view-model></a><yt-lockup-metadata-view-model><h3>Video player-endscreen</h3></yt-lockup-metadata-view-model></div></yt-lockup-view-model>
</div></div>
<div id="secondary">
<ytd-playlist-panel-renderer><div id="items">
<ytd-playlist-panel-video-renderer id="pl-selected" selected><ytd-thumbnail><a id="thumbnail"><div id="overlays"><ytd-thumbnail-overlay-resume-playback-renderer><div id="progress" style="width: 100%;"></div></ytd-thumbnail-overlay-resume-playback-renderer></div></a></ytd-thumbnail><div id="meta">Video pl-selected</div></ytd-playlist-panel-video-renderer>
<ytd-playlist-panel-video-renderer id="pl-watched"><ytd-thumbnail><a id="thumbnail"><div id="overlays"><ytd-thumbnail-overlay-resume-playback-renderer><div id="progress" style="width: 100%;"></div></ytd-thumbnail-overlay-resume-playback-renderer></div></a></ytd-thumbnail><div id="meta">Video pl-watched</div></ytd-playlist-panel-video-renderer>
<ytd-playlist-panel-video-renderer id="pl-unwatched"><ytd-thumbnail><a id="thumbnail"><div id="overlays"><ytd-thumbnail-overlay-resume-playback-renderer><div id="progress" style="width: 0%;"></div></ytd-thumbnail-overlay-resume-playback-renderer></div></a></ytd-thumbnail><div id="meta">Video pl-unwatched</div></ytd-playlist-panel-video-renderer>
</div></ytd-playlist-panel-renderer>
<ytd-watch-next-secondary-results-renderer><div id="items"><ytd-item-section-renderer><div id="contents">
<yt-lockup-view-model class="lockup" id="side-vm-watched"><div class="yt-lockup-view-model"><a class="yt-lockup-view-model__content-image" href="/watch?v=side-vm-watched"><yt-thumbnail-view-model class="ytThumbnailViewModelHost"><div class="ytThumbnailViewModelImage"><img alt=""></div><yt-thumbnail-overlay-progress-bar-view-model class="ytThumbnailOverlayProgressBarHost"><div class="ytThumbnailOverlayProgressBarHostWatchedProgressBar"><div class="ytThumbnailOverlayProgressBarHostWatchedProgressBarSegment" style="width: 100%;"></div></div></yt-thumbnail-overlay-progress-bar-view-model></yt-thumbnail-view-model></a><yt-lockup-metadata-view-model><h3>Video side-vm-watched</h3></yt-lockup-metadata-view-model></div></yt-lockup-view-model>
<yt-lockup-view-model class="lockup" id="side-vm-unwatched"><div class="yt-lockup-view-model"><a class="yt-lockup-view-model__content-image" href="/watch?v=side-vm-unwatched"><yt-thumbnail-view-model class="ytThumbnailViewModelHost"><div class="ytThumbnailViewModelImage"><img alt=""></div></yt-thumbnail-view-model></a><yt-lockup-metadata-view-model><h3>Video side-vm-unwatched</h3></yt-lockup-metadata-view-model></div></yt-lockup-view-model>
<ytd-compact-video-renderer id="side-classic-watched"><ytd-thumbnail><a id="thumbnail"><div id="overlays"><ytd-thumbnail-overlay-resume-playback-renderer><div id="progress" style="width: 55%;"></div></ytd-thumbnail-overlay-resume-playback-renderer></div></a></ytd-thumbnail><div id="meta">Video side-classic-watched</div></ytd-compact-video-renderer>
</div></ytd-item-section-renderer></div></ytd-watch-next-secondary-results-renderer>
</div></ytd-watch-flexy>
</ytd-page-manager></div></ytd-app></body></html>
