name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:unit
      # Live youtube.com checks are skipped on CI (consent walls / bot checks make them flaky there).
      - run: xvfb-run --auto-servernum npm run test:e2e
        env:
          WB_SKIP_LIVE: '1'
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: watched-blocked-extension
          path: dist/*.zip
